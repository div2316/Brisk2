# BRISK2 - run with:  docker compose up --build   then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brisk}
      POSTGRES_DB: ${POSTGRES_DB:-brisk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brisk}:${POSTGRES_PASSWORD:-brisk}@db:5432/${POSTGRES_DB:-brisk}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      COOKIE_SECURE: ${COOKIE_SECURE:-0}   # set to 1 when served over HTTPS

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
